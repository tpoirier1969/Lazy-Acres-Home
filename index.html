<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Acres Home</title>
  <meta name="description" content="Lazy Acres app launcher.">
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 245, 0.9);
      --ink: #243126;
      --muted: #5f6f63;
      --green: #315f48;
      --green-2: #244735;
      --gold: #d7a84f;
      --border: rgba(49, 95, 72, .18);
      --shadow: 0 10px 26px rgba(34, 49, 38, .13);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(215, 168, 79, .24), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(49, 95, 72, .22), transparent 30rem),
        linear-gradient(135deg, #f7f1e7, #e9efe4);
    }

    a { color: inherit; }

    .shell {
      width: min(1060px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.05rem, 6vw, 4rem);
      line-height: .92;
      letter-spacing: -.055em;
    }

    .version {
      justify-self: end;
      align-self: start;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .app-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 86px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .app-card:active { cursor: grabbing; }
    .app-card.dragging {
      opacity: .55;
      transform: scale(.985);
      box-shadow: 0 6px 18px rgba(34, 49, 38, .12);
    }

    .card-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(49,95,72,.15), rgba(215,168,79,.22));
      font-size: 1.4rem;
      user-select: none;
    }

    .card-body {
      min-width: 0;
      display: grid;
      gap: 9px;
    }

    .card-body h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.08;
      letter-spacing: -.025em;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .card-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 11px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 850;
      font-size: .86rem;
    }

    .launch {
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: white;
    }

    .order-controls {
      display: grid;
      gap: 5px;
      align-self: stretch;
      align-content: center;
    }

    .order-controls button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.64);
      color: var(--green-2);
      font-weight: 900;
      font-size: .88rem;
      cursor: pointer;
      line-height: 1;
    }

    .order-controls button:hover,
    .order-controls button:focus-visible,
    .card-actions a:hover,
    .card-actions a:focus-visible {
      outline: 2px solid rgba(215, 168, 79, .55);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      header { grid-template-columns: 1fr; }
      .version { justify-self: start; }
      .shell { width: min(100% - 20px, 1060px); padding-top: 22px; }
      .grid { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
      .app-card { min-height: 82px; border-radius: 16px; padding: 10px; }
      .card-icon { width: 38px; height: 38px; font-size: 1.24rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Lazy Acres</p>
        <h1>Home Base</h1>
      </div>
      <div class="version">v1.0.4 · 2026-06-15</div>
    </header>

    <section class="grid" aria-label="App shortcuts" data-shortcut-grid>
      <article class="app-card" data-id="up-foraging" draggable="true">
        <div class="card-icon" aria-hidden="true">🍄</div>
        <div class="card-body">
          <h2>UP Foraging</h2>
          <div class="card-actions">
            <a class="launch" href="https://tpoirier1969.github.io/up-foraging-guide/fixed-site/index.html" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
        </div>
        <div class="order-controls" aria-label="Reorder UP Foraging">
          <button type="button" data-move="up" aria-label="Move UP Foraging up">↑</button>
          <button type="button" data-move="down" aria-label="Move UP Foraging down">↓</button>
        </div>
      </article>

      <article class="app-card" data-id="shopping-list" draggable="true">
        <div class="card-icon" aria-hidden="true">🛒</div>
        <div class="card-body">
          <h2>Our Shopping List</h2>
          <div class="card-actions">
            <a class="launch" href="https://tpoirier1969.github.io/Shopping_list/" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
        </div>
        <div class="order-controls" aria-label="Reorder Our Shopping List">
          <button type="button" data-move="up" aria-label="Move Our Shopping List up">↑</button>
          <button type="button" data-move="down" aria-label="Move Our Shopping List down">↓</button>
        </div>
      </article>

      <article class="app-card" data-id="scheduler" draggable="true">
        <div class="card-icon" aria-hidden="true">📅</div>
        <div class="card-body">
          <h2>Our Scheduler</h2>
          <div class="card-actions">
            <a class="launch" href="https://tpoirier1969.github.io/Scheduler/" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
        </div>
        <div class="order-controls" aria-label="Reorder Our Scheduler">
          <button type="button" data-move="up" aria-label="Move Our Scheduler up">↑</button>
          <button type="button" data-move="down" aria-label="Move Our Scheduler down">↓</button>
        </div>
      </article>
    </section>
  </main>

  <script>
    const grid = document.querySelector('[data-shortcut-grid]');
    const storageKey = 'lazy-acres-home-order-v1';
    let dragged = null;

    function applySavedOrder() {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      if (!Array.isArray(saved) || !saved.length) return;
      const cards = Array.from(grid.querySelectorAll('.app-card'));
      const byId = new Map(cards.map(card => [card.dataset.id, card]));
      saved.forEach(id => {
        const card = byId.get(id);
        if (card) grid.appendChild(card);
      });
      cards.forEach(card => {
        if (!saved.includes(card.dataset.id)) grid.appendChild(card);
      });
    }

    function saveOrder() {
      const order = Array.from(grid.querySelectorAll('.app-card')).map(card => card.dataset.id);
      localStorage.setItem(storageKey, JSON.stringify(order));
    }

    function moveCard(card, direction) {
      if (!card) return;
      if (direction === 'up' && card.previousElementSibling) {
        grid.insertBefore(card, card.previousElementSibling);
      }
      if (direction === 'down' && card.nextElementSibling) {
        grid.insertBefore(card.nextElementSibling, card);
      }
      saveOrder();
    }

    grid.addEventListener('click', event => {
      const button = event.target.closest('[data-move]');
      if (!button) return;
      const card = button.closest('.app-card');
      moveCard(card, button.dataset.move);
    });

    grid.addEventListener('dragstart', event => {
      dragged = event.target.closest('.app-card');
      if (!dragged) return;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', dragged.dataset.id);
      requestAnimationFrame(() => dragged.classList.add('dragging'));
    });

    grid.addEventListener('dragend', () => {
      if (dragged) dragged.classList.remove('dragging');
      dragged = null;
      saveOrder();
    });

    grid.addEventListener('dragover', event => {
      if (!dragged) return;
      event.preventDefault();
      const target = event.target.closest('.app-card');
      if (!target || target === dragged) return;
      const rect = target.getBoundingClientRect();
      const before = event.clientY < rect.top + rect.height / 2;
      grid.insertBefore(dragged, before ? target : target.nextSibling);
    });

    applySavedOrder();
  </script>
</body>
</html>
