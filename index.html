<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Acres Home</title>
  <meta name="description" content="Lazy Acres app launcher.">
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 245, 0.9);
      --ink: #243126;
      --muted: #5f6f63;
      --green: #315f48;
      --green-2: #244735;
      --gold: #d7a84f;
      --border: rgba(49, 95, 72, .18);
      --shadow: 0 10px 26px rgba(34, 49, 38, .13);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(215, 168, 79, .24), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(49, 95, 72, .22), transparent 30rem),
        linear-gradient(135deg, #f7f1e7, #e9efe4);
    }

    a { color: inherit; }

    .shell {
      width: min(1060px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.05rem, 6vw, 4rem);
      line-height: .92;
      letter-spacing: -.055em;
    }

    .version {
      justify-self: end;
      align-self: start;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .app-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 86px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .app-card:active { cursor: grabbing; }
    .app-card.dragging {
      opacity: .55;
      transform: scale(.985);
      box-shadow: 0 6px 18px rgba(34, 49, 38, .12);
    }

    .card-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(49,95,72,.15), rgba(215,168,79,.22));
      font-size: 1.4rem;
      user-select: none;
    }

    .card-body {
      min-width: 0;
      display: grid;
      gap: 9px;
    }

    .card-body h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.08;
      letter-spacing: -.025em;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .card-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 11px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 850;
      font-size: .86rem;
    }

    .launch {
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: white;
    }

    .order-controls {
      display: grid;
      gap: 5px;
      align-self: stretch;
      align-content: center;
    }

    .order-controls button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.64);
      color: var(--green-2);
      font-weight: 900;
      font-size: .88rem;
      cursor: pointer;
      line-height: 1;
    }

    .order-controls button:hover,
    .order-controls button:focus-visible,
    .card-actions a:hover,
    .card-actions a:focus-visible {
      outline: 2px solid rgba(215, 168, 79, .55);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      header { grid-template-columns: 1fr; }
      .version { justify-self: start; }
      .shell { width: min(100% - 20px, 1060px); padding-top: 22px; }
      .grid { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
      .app-card { min-height: 82px; border-radius: 16px; padding: 10px; }
      .card-icon { width: 38px; height: 38px; font-size: 1.24rem; }
    }
  </style>
</head>
<body>

    <p class="visually-hidden" aria-live="polite" data-reorder-status></p>
  </main>

  <script>
    (() => {
      const grid = document.querySelector('[data-shortcut-grid]');
      const status = document.querySelector('[data-reorder-status]');
      const storageKey = 'lazy-acres-home-shortcut-order-v1';
      let draggingCard = null;

      const getCards = () => Array.from(grid.querySelectorAll('.app-card'));

      const saveOrder = () => {
        const order = getCards().map(card => card.dataset.id);
        localStorage.setItem(storageKey, JSON.stringify(order));
      };

      const announceOrder = card => {
        const cards = getCards();
        const position = cards.indexOf(card) + 1;
        status.textContent = `${card.querySelector('h2').textContent} moved to position ${position} of ${cards.length}.`;
      };

      const applySavedOrder = () => {
        let savedOrder = [];
        try {
          savedOrder = JSON.parse(localStorage.getItem(storageKey) || '[]');
        } catch (error) {
          savedOrder = [];
        }

        if (!Array.isArray(savedOrder) || !savedOrder.length) return;

        const cardsById = new Map(getCards().map(card => [card.dataset.id, card]));
        savedOrder.forEach(id => {
          const card = cardsById.get(id);
          if (card) grid.appendChild(card);
        });
      };

      const moveCard = (card, direction) => {
        const cards = getCards();
        const index = cards.indexOf(card);

        if (direction === 'up' && index > 0) {
          grid.insertBefore(card, cards[index - 1]);
        }

        if (direction === 'down' && index < cards.length - 1) {
          grid.insertBefore(cards[index + 1], card);
        }

        saveOrder();
        announceOrder(card);
        card.focus?.();
      };

      const getInsertBeforeCard = (x, y) => {
        return getCards().filter(card => card !== draggingCard).find(card => {
          const box = card.getBoundingClientRect();
          const halfwayY = box.top + box.height / 2;
          const halfwayX = box.left + box.width / 2;
          return y < halfwayY || (y < box.bottom && x < halfwayX);
        });
      };

      applySavedOrder();

      grid.addEventListener('click', event => {
        const button = event.target.closest('[data-move]');
        if (!button) return;
        moveCard(button.closest('.app-card'), button.dataset.move);
      });

      grid.addEventListener('dragstart', event => {
        const card = event.target.closest('.app-card');
        if (!card || event.target.closest('a, button')) {
          event.preventDefault();
          return;
        }

        draggingCard = card;
        card.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.dataset.id);
      });

      grid.addEventListener('dragover', event => {
        if (!draggingCard) return;
        event.preventDefault();
        const beforeCard = getInsertBeforeCard(event.clientX, event.clientY);
        if (beforeCard) {
          grid.insertBefore(draggingCard, beforeCard);
        } else {
          grid.appendChild(draggingCard);
        }
      });

      grid.addEventListener('dragend', () => {
        if (!draggingCard) return;
        draggingCard.classList.remove('dragging');
        announceOrder(draggingCard);
        saveOrder();
        draggingCard = null;
      });
    })();
  </script>
</body>
</html>
